<!DOCTYPE html>
<!-- Source of og-image.png (1200×630). Re-render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=og-image.png "file://$PWD/og-card.html" -->
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         background: #3D00CC; background-image: linear-gradient(221deg, #00C4E6 0%, #3D00CC 58%, #6100FF 100%); color: #fff; position: relative; }
  .rings { position: absolute; right: -120px; top: -160px; width: 620px; height: 620px; border-radius: 50%;
           border: 2px solid rgba(255,255,255,.12); box-shadow: 0 0 0 70px rgba(255,255,255,.05), 0 0 0 140px rgba(255,255,255,.03); }
  .left { position: absolute; left: 72px; top: 70px; width: 500px; }
  .left img { height: 54px; display: block; }
  .kicker { margin-top: 70px; font-size: 18px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; opacity: .85; }
  h1 { font-size: 78px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.02; margin-top: 10px; }
  p { font-size: 25px; line-height: 1.4; margin-top: 22px; opacity: .92; }
  .ui { position: absolute; right: 64px; top: 92px; width: 470px; background: #fff; color: #0E0F11; border-radius: 22px; padding: 26px;
        box-shadow: 0 30px 70px rgba(14,15,17,.35); }
  .ui h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #5E6875; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { border: 1px solid #E3E8EC; border-radius: 12px; padding: 12px; }
  .stat .n { font-size: 30px; font-weight: 600; }
  .stat .l { font-size: 13px; color: #5E6875; display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .code { margin-top: 18px; display: flex; gap: 10px; }
  .field { flex: 1; border: 2px solid #6100FF; border-radius: 12px; padding: 12px 14px; font: 600 20px ui-monospace, Menlo, monospace; letter-spacing: .06em; }
  .field span { color: #838D95; font-weight: 400; }
  .btn { background: linear-gradient(221deg, #00D7EE 0%, #6100FF 100%); color: #fff; border-radius: 12px; padding: 12px 18px; font-size: 18px; font-weight: 600; }
  .card { position: absolute; right: 150px; bottom: 36px; width: 342px; height: 216px; border-radius: 16px; background: #000;
          box-shadow: 0 24px 60px rgba(0,0,0,.45); transform: rotate(-6deg); padding: 24px; }
  .chip { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .15em; color: #fff; padding: 5px 11px; border-radius: 20px;
          background: linear-gradient(221deg, #00D7EE 0%, #6100FF 100%); }
  .card h3 { font-size: 22px; font-weight: 500; margin-top: 34px; }
  .card ul { list-style: none; margin-top: 8px; font-size: 11.5px; color: #C9CED4; line-height: 1.6; }
  .card ul li::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3D7BFF; margin-right: 7px; vertical-align: 1px; }
  .qr { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 104px; height: 104px; background: #fff; border-radius: 9px; padding: 8px;
        display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .qr i { background: #0E0F11; border-radius: 1px; }
  .qr i.o { background: transparent; }
</style></head>
<body>
  <div class="rings"></div>
  <div class="left">
    <img src="https://cdn.ahlab.org/media/site/ahllogo_white.png" alt="">
    <div class="kicker">Admin console</div>
    <h1>Visitor Passes</h1>
    <p>Activate a card at handover, scan it on your phone, track every pass and print new sheets.</p>
  </div>
  <div class="ui">
    <h2>All passes</h2>
    <div class="stats">
      <div class="stat"><div class="n">12</div><div class="l"><span class="dot" style="background:#5E6875"></span>Inactive</div></div>
      <div class="stat"><div class="n">3</div><div class="l"><span class="dot" style="background:#0A7A3E"></span>Active</div></div>
      <div class="stat"><div class="n">9</div><div class="l"><span class="dot" style="background:#3D00CC"></span>Used</div></div>
    </div>
    <div class="code"><div class="field"><span>AHLV-</span>KY5F-X3AY</div><div class="btn">Activate</div></div>
  </div>
  <div class="card">
    <span class="chip">VISITOR PASS</span>
    <h3>My AHL Account</h3>
    <ul><li>Scan the code</li><li>Fill a 30-second form</li><li>Get email, Slack &amp; calendar</li></ul>
    <div class="qr" id="qr"></div>
  </div>
  <script>
    // decorative QR-like pattern (not a real code)
    var on = '1111111100010110101011010101101110111011011010101101001000011101';
    var q = document.getElementById('qr');
    for (var i = 0; i < 49; i++) { var c = document.createElement('i'); if (on[i % on.length] === '0') c.className = 'o'; q.appendChild(c); }
  </script>
</body></html>
