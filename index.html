<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Visitor Passes — Augmented Human Lab</title>
  <meta name="description" content="Admin console for AHL Visitor Passes: activate a card at handover, scan its QR on mobile, track every pass and print new credit-card sheets." />
  <link rel="canonical" href="https://passes.ahlab.org/" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#3D00CC" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Augmented Human Lab" />
  <meta property="og:title" content="Visitor Passes — AHL admin console" />
  <meta property="og:description" content="Activate AHL Visitor Passes at handover, scan cards on mobile, track every pass and print new card sheets. For lab admins." />
  <meta property="og:url" content="https://passes.ahlab.org/" />
  <meta property="og:image" content="https://passes.ahlab.org/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="AHL Visitor Passes console: pass counts and an Activate panel next to a black Visitor Pass card." />
  <meta property="og:locale" content="en_SG" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Visitor Passes — AHL admin console" />
  <meta name="twitter:description" content="Activate AHL Visitor Passes at handover, scan cards on mobile, track every pass and print new card sheets." />
  <meta name="twitter:image" content="https://passes.ahlab.org/og-image.png" />
  <meta name="twitter:image:alt" content="AHL Visitor Passes console: pass counts and an Activate panel next to a black Visitor Pass card." />

  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #6100FF; --accent-ink: #4400B3;
      --grad: linear-gradient(221deg, #00D7EE 0%, #6100FF 100%);
      --grad-bar: linear-gradient(221deg, #00C4E6 0%, #3D00CC 58%, #6100FF 100%);
      --bg: #F4F7F9; --card: #FFFFFF; --line: #E3E8EC; --line-2: #D7DDE3;
      --ink: #0E0F11; --n80: #5E6875; --n70: #838D95; --n60: #AAAFB6;
      --s-inactive: #5E6875; --s-inactive-bg: #EDF0F3;
      --s-active: #0A7A3E;   --s-active-bg: #E3F7EC;
      --s-used: #3D00CC;     --s-used-bg: #EEE7FF;
      --s-revoked: #A8071A;  --s-revoked-bg: #FCE8EA;
      --s-expired: #8A5A00;  --s-expired-bg: #FDF0E1;
      --radius: 14px;
    }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    /* ── app bar ─────────────────────────────────────── */
    .appbar { background-color: #3D00CC; background-image: var(--grad-bar); color: #fff;
              padding-top: env(safe-area-inset-top); position: sticky; top: 0; z-index: 30; }
    .appbar-inner { max-width: 1080px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
    .appbar img.logo { height: 30px; width: auto; display: block; }
    .appbar .title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-right: auto; white-space: nowrap; }
    /* account menu */
    .who { position: relative; }
    .who-btn { display: flex; align-items: center; gap: 9px; background: rgba(255,255,255,.12); color: #fff;
               border: 1px solid rgba(255,255,255,.24); border-radius: 999px; padding: 3px 12px 3px 3px; font-size: 14px;
               font-weight: 600; transition: background .15s; max-width: 260px; }
    .who-btn:hover, .who.open .who-btn { background: rgba(255,255,255,.22); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; object-fit: cover; background: rgba(255,255,255,.25);
              display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
    .who-btn .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who-btn .caret { font-size: 11px; opacity: .85; transition: transform .15s; }
    .who.open .who-btn .caret { transform: rotate(180deg); }
    .who-menu { display: none; position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: #fff;
                color: var(--ink); border-radius: 12px; box-shadow: 0 12px 34px rgba(14,15,17,.22); padding: 6px; z-index: 50; }
    .who.open .who-menu { display: block; }
    .who-menu .acct { padding: 10px 12px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .who-menu .acct strong { display: block; font-size: 14px; }
    .who-menu .acct span { display: block; font-size: 13px; color: var(--n70); word-break: break-all; }
    .who-menu button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none;
                       border-radius: 8px; padding: 9px 12px; font-size: 14px; text-align: left; color: var(--ink); }
    .who-menu button:hover { background: var(--bg); }
    .who-menu button i { color: var(--n70); width: 16px; }
    @media (max-width: 600px) {
      .appbar-inner { gap: 10px; }
      .appbar img.logo { height: 26px; }
      .appbar .title { font-size: 15px; }
      .who-btn { padding-right: 9px; }
      .who-btn .name { display: none; }
    }
    .btn-ghost { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.28);
                 border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; transition: background .15s; }
    .btn-ghost:hover { background: rgba(255,255,255,.24); }

    main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }

    /* ── gate / message screens ─────────────────────── */
    /* sign-in / blocked / loading: centred in the space under the app bar */
    body.centered main { display: flex; align-items: center; justify-content: center;
                         min-height: calc(100vh - 62px - env(safe-area-inset-top)); min-height: calc(100dvh - 62px - env(safe-area-inset-top));
                         padding-top: 24px; padding-bottom: 24px; }
    .screen { max-width: 440px; width: 100%; margin: 0 auto; text-align: center; background: var(--card);
              border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 28px; box-shadow: 0 8px 30px rgba(14,15,17,.06); }
    .screen .badge { width: 64px; height: 64px; border-radius: 50%; background: var(--grad); color: #fff; display: grid;
                     place-items: center; font-size: 26px; margin: 0 auto 18px; }
    .screen h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .screen p { color: var(--n80); font-size: 15px; margin-bottom: 22px; }

    /* Pill buttons, like the other AHL forms. background-origin: border-box keeps a gradient
       from tiling into the (transparent) 1px border, which showed as stray edge slivers. */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px;
           background-origin: border-box;
           padding: 11px 20px; font-weight: 600; font-size: 15px; border: 1px solid transparent;
           transition: box-shadow .15s, background .15s, border-color .15s, opacity .15s; white-space: nowrap; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    a.btn { text-decoration: none; }
    .btn-primary { background: var(--grad) border-box; border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(97,0,255,.22); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(97,0,255,.34); }
    .btn-secondary { background: #fff; color: var(--ink); border-color: var(--line-2); }
    .btn-secondary:hover:not(:disabled) { background: #F7F9FA; border-color: #C5CDD5; }
    .btn-danger { background: #fff; color: var(--s-revoked); border-color: #F0C4CA; }
    .btn-danger:hover:not(:disabled) { background: var(--s-revoked-bg); }
    .btn-danger.confirm { background: var(--s-revoked); color: #fff; border-color: var(--s-revoked); }
    .btn-sm { padding: 7px 14px; font-size: 13.5px; }

    /* ── panels ─────────────────────────────────────── */
    .summary { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .summary .stats { flex: 1 1 520px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
    .panel h2 { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--n80);
                margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .panel h2 i { color: var(--accent); }

    /* activate */
    .scan-only { display: none; }
    @media (pointer: coarse) { .scan-only { display: inline-flex; } }
    td.col-act { text-align: right; white-space: nowrap; width: 1%; }
    .btn-act { padding: 6px 14px; font-size: 13px; width: 112px; justify-content: center; }
    #rows .chip { width: 96px; justify-content: center; }   /* uniform badge column */
    tr.flash td { animation: flash 1.6s ease-out; }
    @keyframes flash { from { background: #EEE7FF; } to { background: transparent; } }
    .hint { color: var(--n70); font-size: 13px; margin-top: 10px; }

    .field-label { font-size: 13px; font-weight: 600; margin: 4px 0 6px; display: block; }
    .text-input { width: 100%; border: 1.5px solid var(--line-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none;
                  transition: border-color .15s, box-shadow .15s; }
    .text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(97,0,255,.12); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .msg { margin-top: 12px; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .msg.ok { background: var(--s-active-bg); color: var(--s-active); }
    .msg.err { background: var(--s-revoked-bg); color: var(--s-revoked); }
    .msg.info { background: #EEF2FF; color: #2B3A8C; }

    /* stats */
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 520px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 10px; background: #fff; text-align: left;
            transition: border-color .15s, box-shadow .15s; }
    .stat:hover { border-color: #C5CDD5; }
    .stat.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(97,0,255,.10); }
    .stat .n { font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 12px; color: var(--n80); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
    /* fixed width: the button's label changes (confirm / creating…) but the tiles never resize */
    .new-sheet { flex: 0 0 260px; display: flex; align-items: center; }
    .new-sheet .btn { width: 100%; }
    @media (max-width: 600px) { .new-sheet { flex-basis: 100%; } }
    /* armed "Create 8 passes?" — a slow brand-gradient sweep (colour only, no movement) */
    .btn.confirming { color: #fff; border-color: transparent;
      background: linear-gradient(90deg, #6100FF, #00C4E6, #6100FF) border-box; background-size: 200% 100%;
      animation: sweep 1.6s linear infinite; box-shadow: 0 4px 18px rgba(97,0,255,.32); }
    @keyframes sweep { from { background-position: 0% 0; } to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .btn.confirming { animation: none; background: var(--grad) border-box; } }

    /* passes sets */
    .sets { margin-bottom: 16px; padding-bottom: 8px; }
    .sets-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .sets-head h2 { margin-bottom: 8px; }
    .link-btn { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 13.5px; padding: 4px 6px; border-radius: 6px; }
    .link-btn:hover { background: var(--bg); }
    .set-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .set-row:first-child { border-top: none; }
    .set-row .what { flex: 1 1 240px; min-width: 0; }
    .set-row .what strong { font-size: 15px; }
    .set-row .what .sub { color: var(--n70); font-size: 13px; }
    .set-row .acts { display: flex; gap: 8px; }
    .set-row.on { background: linear-gradient(90deg, rgba(97,0,255,.05), transparent); }

    /* chips */
    .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em;
            text-transform: uppercase; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .st-INACTIVE { color: var(--s-inactive); background: var(--s-inactive-bg); }
    .st-ACTIVE   { color: var(--s-active);   background: var(--s-active-bg); }
    .st-USED     { color: var(--s-used);     background: var(--s-used-bg); }
    .st-REVOKED  { color: var(--s-revoked);  background: var(--s-revoked-bg); }
    .st-EXPIRED  { color: var(--s-expired);  background: var(--s-expired-bg); }
    .dot.st-INACTIVE { background: var(--s-inactive); } .dot.st-ACTIVE { background: var(--s-active); }
    .dot.st-USED { background: var(--s-used); } .dot.st-REVOKED { background: var(--s-revoked); } .dot.st-EXPIRED { background: #C77700; }

    /* list */
    .list-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .list-tools .search { flex: 1 1 220px; position: relative; }
    .list-tools .search i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--n60); font-size: 14px; }
    .list-tools .search input { padding-left: 34px; }
    .list-tools select { border: 1.5px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: #fff; font-size: 14px; max-width: 100%; }
    .count-note { color: var(--n70); font-size: 13px; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--n70);
         padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr { cursor: pointer; transition: background .12s; }
    tbody tr:hover { background: #F7F9FA; }
    td.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
    td .sub { color: var(--n70); font-size: 12.5px; }
    .empty { text-align: center; color: var(--n70); padding: 34px 10px; }
    @media (max-width: 680px) {
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tbody tr { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; padding: 10px 12px; }
      td { border: none; padding: 2px 0; }
      td.col-batch, td.col-expires { display: none; }
      td.col-act { text-align: left; width: auto; padding-top: 8px; }
    }

    /* drawer */
    .scrim { position: fixed; inset: 0; background: rgba(14,15,17,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: #fff; z-index: 41;
              box-shadow: -10px 0 40px rgba(14,15,17,.18); transform: translateX(100%); transition: transform .22s ease;
              display: flex; flex-direction: column; }
    .drawer.open { transform: none; }
    .drawer header { display: flex; align-items: center; gap: 10px; padding: 18px 20px; border-bottom: 1px solid var(--line);
                     padding-top: calc(18px + env(safe-area-inset-top)); }
    .drawer header .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; font-size: 18px; letter-spacing: .05em; }
    #dCopy { margin-right: auto; }
    .icon-btn { background: none; border: none; width: 36px; height: 36px; border-radius: 8px; color: var(--n80); font-size: 18px; }
    .icon-btn:hover { background: var(--bg); }
    .drawer .body { padding: 18px 20px 28px; overflow-y: auto; flex: 1; }
    .timeline { list-style: none; margin: 4px 0 18px; }
    .timeline li { position: relative; padding: 0 0 14px 22px; font-size: 14px; }
    .timeline li::before { content: ''; position: absolute; left: 5px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--n60); }
    .timeline li::after { content: ''; position: absolute; left: 8.5px; top: 18px; bottom: 0; width: 1px; background: var(--line-2); }
    .timeline li:last-child::after { display: none; }
    .timeline li.k-active::before { background: var(--s-active); }
    .timeline li.k-used::before { background: var(--s-used); }
    .timeline li.k-revoked::before { background: var(--s-revoked); }
    .timeline li.k-expired::before { background: #C77700; }
    .timeline .when { color: var(--n70); font-size: 12.5px; }
    .drawer h3 { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--n70); margin: 6px 0 10px; }

    /* scanner */
    .scanner { position: fixed; inset: 0; background: #000; z-index: 60; display: flex; flex-direction: column; }
    .scanner video { flex: 1; width: 100%; object-fit: cover; }
    .scanner .frame { position: absolute; left: 50%; top: 45%; width: min(64vw, 280px); aspect-ratio: 1; transform: translate(-50%, -50%);
                      border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.85); }
    .scanner .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
                    display: flex; justify-content: space-between; align-items: center; color: #fff;
                    background: linear-gradient(transparent, rgba(0,0,0,.7)); }
    .scanner .bar span { font-size: 14px; opacity: .9; }

    /* copy-code icon button */
    .copy-btn { background: none; border: none; width: 28px; height: 28px; border-radius: 6px; color: var(--n60);
                display: inline-grid; place-items: center; font-size: 13px; vertical-align: middle; margin-left: 4px;
                transition: background .12s, color .12s; flex: none; }
    .copy-btn:hover { background: var(--bg); color: var(--accent); }
    .copy-btn.done { color: var(--s-active); }
    .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
             background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 70;
             opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); }
    .toast.show { opacity: 1; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; color: var(--n60); font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <img class="logo" src="https://cdn.ahlab.org/media/site/ahllogo_white.png" alt="Augmented Human Lab" />
      <div class="title">Visitor Passes</div>
      <div class="who hidden" id="who">
        <button class="who-btn" id="whoBtn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar" id="whoAvatar"></span>
          <span class="name" id="whoName"></span>
          <i class="fa-solid fa-chevron-down caret"></i>
        </button>
        <div class="who-menu" role="menu">
          <div class="acct"><strong id="whoMenuName"></strong><span id="whoEmail"></span></div>
          <button id="signOutBtn" type="button" role="menuitem"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- signed out -->
    <section class="screen hidden" id="gate">
      <div class="badge"><i class="fa-solid fa-id-card"></i></div>
      <h1>Visitor Passes</h1>
      <p>Activate, track and print AHL Visitor Passes. Sign in with your @ahlab.org admin account.</p>
      <button class="btn btn-primary" id="signInBtn" type="button"><i class="fa-brands fa-google"></i>Sign in with AHL</button>
    </section>

    <!-- signed in, not an admin / other blocking error -->
    <section class="screen hidden" id="blocked">
      <div class="badge" style="background:#A8071A"><i class="fa-solid fa-lock"></i></div>
      <h1 id="blockedTitle">Admins only</h1>
      <p id="blockedMsg"></p>
      <button class="btn btn-secondary" id="blockedSignOut" type="button">Sign in with another account</button>
    </section>

    <!-- loading -->
    <section class="screen hidden" id="loading" style="border:none;background:none;box-shadow:none">
      <i class="fa-solid fa-circle-notch spin" style="font-size:28px;color:var(--accent)"></i>
    </section>

    <!-- console -->
    <section class="hidden" id="app">
      <div class="panel summary">
        <div class="stats" id="stats"></div>
        <div class="new-sheet">
          <button class="btn btn-secondary" id="newSheetBtn" type="button"><i class="fa-solid fa-plus"></i>New passes set (set of 8)</button>
        </div>
      </div>

      <div class="panel sets">
        <div class="sets-head">
          <h2><i class="fa-solid fa-layer-group"></i>Passes sets</h2>
          <button class="link-btn hidden" id="setsMore" type="button"></button>
        </div>
        <div id="sets"></div>
      </div>

      <div class="panel">
        <div class="list-tools">
          <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
            <input class="text-input" id="searchInput" placeholder="Search or type a pass code…" autocapitalize="characters" spellcheck="false" /></div>
          <button class="btn btn-secondary scan-only" type="button" id="scanBtn"><i class="fa-solid fa-qrcode"></i>Scan</button>
          <select id="stateSelect" aria-label="Status">
            <option value="ALL">All statuses</option>
            <option value="INACTIVE">Inactive</option>
            <option value="ACTIVE">Active</option>
            <option value="USED">Used</option>
            <option value="REVOKED">Revoked</option>
            <option value="EXPIRED">Expired</option>
          </select>
          <select id="batchSelect" aria-label="Batch"><option value="">All batches</option></select>
          <span class="count-note" id="countNote"></span>
        </div>
        <table>
          <thead><tr><th>Code</th><th>Status</th><th>Holder</th><th class="col-batch">Batch</th><th class="col-expires">Expires</th><th class="col-act"></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <footer>Augmented Human Lab · Visitor Passes console</footer>
    </section>
  </main>

  <!-- pass detail drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header>
      <span class="code" id="dCode"></span><span id="dCopy"></span>
      <span class="chip" id="dChip"></span>
      <button class="icon-btn" id="dClose" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>
    <div class="body" id="dBody"></div>
  </aside>

  <!-- camera scanner (mobile) -->
  <div class="scanner hidden" id="scanner">
    <video id="scanVideo" playsinline muted></video>
    <div class="frame"></div>
    <div class="bar"><span id="scanStatus">Point at the QR on the card's back</span>
      <button class="btn-ghost" id="scanClose" type="button">Cancel</button></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    // ── config ──────────────────────────────────────────
    var PROD_API = 'https://script.google.com/macros/s/AKfycbwjUs3ZL8jfmclSfxAVKIJSwhNdV84gyWqRpFwM9FHCHaUCL15lW-eh7hIM0MOGp-yb/exec';
    var DEV_API  = 'https://script.google.com/macros/s/AKfycbynkdtZwAc1nRCNh4caZOZKb7DyXxpiheLr21r65r_QLoNnAt7Pjgjfa1QM7JLJ1i4K/exec';
    var IS_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    var API = IS_LOCAL ? DEV_API : PROD_API;
    var BROKER = 'https://script.google.com/a/macros/ahlab.org/s/AKfycbwHPIr3JR0ZQ9471E1W0KqM-BggXLv8g8wvx0Z3Qwjx2HajD71gBf60CxrJBcrN_51T/exec';
    var DOMAIN = 'ahlab.org';
    var SESSION_KEY = 'ahl-auth-v1', NONCE_KEY = 'ahl-auth-nonce-v1', RETURN_KEY = 'ahl-auth-return-v1';
    var SESSION_TTL = 7 * 24 * 3600 * 1000;   // matches the broker's token TTL

    var STATES = ['INACTIVE', 'ACTIVE', 'USED', 'REVOKED', 'EXPIRED'];
    var LABEL = { INACTIVE: 'Inactive', ACTIVE: 'Active', USED: 'Used', REVOKED: 'Revoked', EXPIRED: 'Expired' };

    var state = { session: null, data: null, filter: { state: 'ALL', q: '', batch: '' }, open: null };
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }

    // ── session (AHL member-login broker) ────────────────
    function getSession() {
      try {
        var s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (s && s.token && typeof s.ts === 'number' && Date.now() - s.ts < SESSION_TTL &&
            String(s.email || '').toLowerCase().slice(-(DOMAIN.length + 1)) === '@' + DOMAIN) return s;
        if (s) localStorage.removeItem(SESSION_KEY);
      } catch (e) {}
      return null;
    }
    function nonce() {
      var b = new Uint8Array(16); crypto.getRandomValues(b);
      return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    }
    function signIn() {
      var n = nonce();
      try { localStorage.setItem(NONCE_KEY, n); localStorage.setItem(RETURN_KEY, location.pathname + location.search); }
      catch (e) { toast('Sign-in needs site storage — try a regular (non-private) window.'); return; }
      location.assign(BROKER + '?return=' + encodeURIComponent(location.origin + '/auth-callback/') + '&nonce=' + encodeURIComponent(n));
    }
    function signOut() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      state.session = null; show('gate');
    }

    // ── API ─────────────────────────────────────────────
    function api(action, extra) {
      var body = Object.assign({ action: action, auth: state.session && state.session.token }, extra || {});
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok && res.code === 'auth') { signOut(); throw new Error(res.error); }
          if (!res.ok && res.code === 'forbidden') { blocked('Admins only', res.error + ' Ask an existing admin to add you.'); throw new Error(res.error); }
          if (!res.ok && res.code === 'config') { blocked('Not set up yet', res.error); throw new Error(res.error); }
          if (!res.ok) throw new Error(res.error || 'Request failed.');
          return res;
        });
    }

    // ── screens ─────────────────────────────────────────
    function show(id) {
      ['gate', 'blocked', 'loading', 'app'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); });
      document.body.classList.toggle('centered', id !== 'app');
      $('who').classList.toggle('hidden', !state.session || id === 'gate');
    }
    function blocked(title, msg) { $('blockedTitle').textContent = title; $('blockedMsg').textContent = msg; show('blocked'); }
    var toastTimer;
    function toast(msg) {
      var t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
    }

    // ── formatting ──────────────────────────────────────
    function fmt(iso, withTime) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleString('en-SG', Object.assign({ timeZone: 'Asia/Singapore', day: 'numeric', month: 'short', year: 'numeric' },
        withTime ? { hour: 'numeric', minute: '2-digit' } : {}));
    }
    function rel(iso) {
      var ms = new Date(iso) - Date.now(), day = 864e5, d = Math.round(Math.abs(ms) / day);
      if (Math.abs(ms) < day) { var h = Math.max(1, Math.round(Math.abs(ms) / 36e5)); return ms > 0 ? 'in ' + h + ' h' : h + ' h ago'; }
      return ms > 0 ? 'in ' + d + ' day' + (d === 1 ? '' : 's') : d + ' day' + (d === 1 ? '' : 's') + ' ago';
    }
    function copyBtn(code) {
      return '<button class="copy-btn" type="button" data-copy="' + esc(code) + '" title="Copy code" aria-label="Copy ' + esc(code) + '">' +
             '<i class="fa-regular fa-copy"></i></button>';
    }
    function chip(st) { return '<span class="chip st-' + st + '">' + LABEL[st] + '</span>'; }
    function who(email) { return email ? String(email).split('@')[0] : ''; }
    function holder(p) {
      if (p.state === 'USED') return esc(p.visitorName) + '<div class="sub">' + esc(p.accountEmail) + '</div>';
      if (p.state === 'ACTIVE') return (p.givenTo ? esc(p.givenTo) + '<div class="sub">by ' : 'Activated by ') +
        esc(who(p.activatedBy)) + (p.givenTo ? ' · ' : '<div class="sub">') + 'lapses ' + rel(p.activeUntil) + '</div>';
      if (p.state === 'REVOKED') return '<span class="sub">revoked by ' + esc(who(p.revokedBy)) + '</span>';
      if (p.lapsed) return '<span class="sub">activation lapsed</span>';
      return '<span class="sub">—</span>';
    }

    // ── code input ──────────────────────────────────────
    /** "ahlv kyf5x3ay", "KY5F-X3AY", a scanned URL … → "AHLV-KY5F-X3AY" (or '' if not 8 chars). */
    function normCode(raw) {
      var s = String(raw || '').toUpperCase();
      var m = s.match(/TOKEN=([A-Z0-9-]+)/); if (m) s = m[1];
      s = s.replace(/[^A-Z0-9]/g, '');
      if (s.indexOf('AHLV') === 0) s = s.slice(4);
      return s.length === 8 ? 'AHLV-' + s.slice(0, 4) + '-' + s.slice(4) : '';
    }
    // ── data + list ─────────────────────────────────────
    function load() {
      return api('list').then(function (res) {
        state.data = res;
        renderAll();
      });
    }
    function upsert(p) {
      if (!state.data) return;
      var i = state.data.passes.findIndex(function (x) { return x.code === p.code; });
      if (i === -1) state.data.passes.push(p); else state.data.passes[i] = p;
      recount(); renderAll();
      if (state.open === p.code) openDrawer(p.code);
    }
    function recount() {
      var c = {}; STATES.forEach(function (s) { c[s] = 0; });
      state.data.passes.forEach(function (p) { c[p.state]++; });
      state.data.counts = c;
    }

    function renderAll() { renderStats(); renderSets(); renderBatches(); renderRows(); }

    function renderStats() {
      $('stats').innerHTML = STATES.map(function (s) {
        return '<button class="stat' + (state.filter.state === s ? ' on' : '') + '" data-state="' + s + '" type="button">' +
               '<div class="n">' + (state.data.counts[s] || 0) + '</div>' +
               '<div class="l"><span class="dot st-' + s + '"></span>' + LABEL[s] + '</div></button>';
      }).join('');
    }

    function renderBatches() {
      var sel = $('batchSelect'), cur = state.filter.batch, seen = {}, batches = [];
      state.data.passes.forEach(function (p) { if (p.batch && !seen[p.batch]) { seen[p.batch] = 1; batches.push(p.batch); } });
      batches.sort().reverse();
      sel.innerHTML = '<option value="">All batches</option>' + batches.map(function (b) {
        return '<option value="' + esc(b) + '"' + (b === cur ? ' selected' : '') + '>' + esc(b) + '</option>';
      }).join('');
    }

    function filtered() {
      var f = state.filter, q = f.q.toLowerCase();
      return state.data.passes.filter(function (p) {
        if (f.state !== 'ALL' && p.state !== f.state) return false;
        if (f.batch && p.batch !== f.batch) return false;
        if (q) {
          var hay = [p.code, p.givenTo, p.visitorName, p.visitorEmail, p.accountEmail, p.activatedBy, p.batch].join(' ').toLowerCase();
          if (hay.indexOf(q) === -1 && hay.replace(/-/g, '').indexOf(q.replace(/-/g, '')) === -1) return false;
        }
        return true;
      }).sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || '') || a.code.localeCompare(b.code); });
    }

    /** Inline action for a row: Activate (inactive / revoked) or Revoke (active). */
    function rowAction(p) {
      if (p.state === 'INACTIVE' || p.state === 'REVOKED')
        return '<button class="btn btn-primary btn-act" data-row-act="activate" data-code="' + esc(p.code) + '" type="button"><i class="fa-solid fa-bolt"></i>Activate</button>';
      if (p.state === 'ACTIVE')
        return '<button class="btn btn-danger btn-act" data-row-act="revoke" data-code="' + esc(p.code) + '" type="button"><i class="fa-solid fa-ban"></i>Revoke</button>';
      return '';
    }

    function renderRows() {
      var rows = filtered();
      $('countNote').textContent = rows.length + ' of ' + state.data.passes.length;
      if (!rows.length) { $('rows').innerHTML = '<tr><td colspan="6" class="empty">No passes match.</td></tr>'; return; }
      $('rows').innerHTML = rows.map(function (p) {
        return '<tr data-open="' + esc(p.code) + '"><td class="code">' + esc(p.code) + copyBtn(p.code) + '</td><td>' + chip(p.state) + '</td>' +
               '<td>' + holder(p) + '</td><td class="col-batch"><span class="sub">' + esc(p.batch) + '</span></td>' +
               '<td class="col-expires"><span class="sub">' + fmt(p.expiresAt) + '</span></td>' +
               '<td class="col-act">' + rowAction(p) + '</td></tr>';
      }).join('');
    }

    $('stats').addEventListener('click', function (e) {
      var b = e.target.closest('[data-state]'); if (!b) return;
      state.filter.state = state.filter.state === b.dataset.state ? 'ALL' : b.dataset.state;
      $('stateSelect').value = state.filter.state; renderStats(); renderRows();
    });
    $('stateSelect').addEventListener('change', function (e) { state.filter.state = e.target.value; renderStats(); renderRows(); });
    $('batchSelect').addEventListener('change', function (e) { state.filter.batch = e.target.value; renderSets(); renderRows(); });
    $('searchInput').addEventListener('input', function (e) {
      var v = e.target.value.trim(), c = normCode(v);
      if (c && /[/?=]/.test(v)) { e.target.value = c; v = c; }   // pasted QR link → its code
      state.filter.q = v; renderRows();
    });
    /** Show one pass in the list (clears other filters) and flash its row. */
    function focusCode(code) {
      state.filter = { state: 'ALL', q: code, batch: '' };
      $('searchInput').value = code; $('stateSelect').value = 'ALL';
      renderAll();
      var row = document.querySelector('tr[data-open="' + code + '"]');
      if (row) { row.classList.add('flash'); row.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      else toast('No pass with code ' + code);
    }
    document.addEventListener('click', function (e) {
      var c = e.target.closest('[data-copy]');
      if (c) { copyCode(c); return; }   // don't also open the row
      var ra = e.target.closest('[data-row-act]');
      if (ra) { rowAct(ra); return; }
      var o = e.target.closest('[data-open]'); if (o) openDrawer(o.dataset.open);
    });
    var armed = null;   // revoke needs a second click within 4 s
    function rowAct(btn) {
      var act = btn.dataset.rowAct, code = btn.dataset.code;
      if (act === 'revoke' && armed !== btn) {
        armed = btn; btn.classList.add('confirm'); btn.innerHTML = '<i class="fa-solid fa-ban"></i>Confirm';
        setTimeout(function () { if (armed === btn) { armed = null; if (btn.isConnected) { btn.classList.remove('confirm'); btn.innerHTML = '<i class="fa-solid fa-ban"></i>Revoke'; } } }, 4000);
        return;
      }
      armed = null;
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch spin"></i>';
      api(act, { code: code }).then(function (res) {
        upsert(res.pass);
        toast(act === 'activate' ? code + ' activated — works until ' + fmt(res.pass.activeUntil, true) : code + ' revoked');
      }).catch(function (err) { toast(err.message); renderRows(); });
    }

    function copyCode(btn) {
      var code = btn.dataset.copy;
      var done = function () {
        btn.classList.add('done'); btn.innerHTML = '<i class="fa-solid fa-check"></i>';
        setTimeout(function () { btn.classList.remove('done'); btn.innerHTML = '<i class="fa-regular fa-copy"></i>'; }, 1400);
        toast('Copied ' + code);
      };
      var legacy = function () {   // older browsers / clipboard API refused
        var t = document.createElement('textarea');
        t.value = code; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        var ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
        t.remove();
        if (ok) done(); else toast('Couldn\'t copy — select the code instead.');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, legacy);
      else legacy();
    }

    function printUrl(batch) { return '/print.html?batch=' + encodeURIComponent(batch); }
    function openPrint(batch) { window.open(printUrl(batch), '_blank'); }

    // ── passes sets (one per batch) ─────────────────────
    var setsAll = false, SETS_SHOWN = 4;
    function batchesSummary() {
      var by = {};
      state.data.passes.forEach(function (p) {
        if (!p.batch) return;
        var b = by[p.batch] || (by[p.batch] = { batch: p.batch, total: 0, printable: 0, used: 0, createdAt: '' });
        b.total++;
        if (p.state === 'INACTIVE' || p.state === 'ACTIVE') b.printable++;
        if (p.state === 'USED') b.used++;
        if ((p.createdAt || '') > b.createdAt) b.createdAt = p.createdAt || '';
      });
      return Object.keys(by).map(function (k) { return by[k]; })
        .sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt) || b.batch.localeCompare(a.batch); });
    }
    function renderSets() {
      var list = batchesSummary(), shown = setsAll ? list : list.slice(0, SETS_SHOWN);
      $('sets').innerHTML = list.length ? shown.map(function (b) {
        var by = (b.batch.split(' · ')[1] || '');
        return '<div class="set-row' + (state.filter.batch === b.batch ? ' on' : '') + '">' +
          '<div class="what"><strong>' + esc(fmt(b.createdAt, true) || b.batch) + '</strong>' +
          '<div class="sub">' + (by ? 'by ' + esc(by) + ' · ' : '') + b.total + ' card' + (b.total === 1 ? '' : 's') +
          ' · ' + b.printable + ' printable' + (b.used ? ' · ' + b.used + ' used' : '') + '</div></div>' +
          '<div class="acts">' +
          '<button class="btn btn-secondary btn-sm" data-set-show="' + esc(b.batch) + '" type="button"><i class="fa-solid fa-list"></i>' +
            (state.filter.batch === b.batch ? 'Showing' : 'Show passes') + '</button>' +
          '<a class="btn btn-primary btn-sm" href="' + printUrl(b.batch) + '" target="_blank" rel="noopener"' +
            (b.printable ? '' : ' aria-disabled="true" style="opacity:.45;pointer-events:none"') +
            '><i class="fa-solid fa-print"></i>Open print sheet</a>' +
          '</div></div>';
      }).join('') : '<p class="hint" style="margin:6px 0 10px">No sets yet — create one with <strong>New passes set</strong>.</p>';
      var more = $('setsMore');
      more.classList.toggle('hidden', list.length <= SETS_SHOWN);
      more.textContent = setsAll ? 'Show fewer' : 'Show all (' + list.length + ')';
    }
    $('setsMore').addEventListener('click', function () { setsAll = !setsAll; renderSets(); });
    $('sets').addEventListener('click', function (e) {
      var b = e.target.closest('[data-set-show]'); if (!b) return;
      var batch = b.dataset.setShow;
      state.filter.batch = state.filter.batch === batch ? '' : batch;
      renderSets(); renderBatches(); renderRows();
      if (state.filter.batch) document.querySelector('.list-tools').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Shown in the print tab while the new set is being created (the tab must open inside
    // the click to dodge pop-up blockers; it then navigates to the set's print sheet).
    var LOADING_PAGE = '<!doctype html><html><head><meta charset="utf-8"><title>Creating passes… — Visitor Passes</title>' +
      '<meta name="viewport" content="width=device-width,initial-scale=1"><style>' +
      'html,body{margin:0;height:100%}' +
      'body{display:grid;place-items:center;background:#3D00CC;background-image:linear-gradient(221deg,#00C4E6 0%,#3D00CC 58%,#6100FF 100%);' +
      'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;text-align:center}' +
      '.ring{width:132px;height:132px;border-radius:50%;margin:0 auto 26px;position:relative;display:grid;place-items:center}' +
      '.ring::before{content:"";position:absolute;inset:0;border-radius:50%;padding:3px;' +
      'background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.95) 300deg,rgba(255,255,255,0) 360deg);' +
      '-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;' +
      'animation:spin 1.1s linear infinite}' +
      '.ring img{width:62px;height:62px;object-fit:cover;object-position:left center;animation:pulse 1.6s ease-in-out infinite}' +
      'h1{font-size:20px;font-weight:600;margin:0 0 6px}p{margin:0;opacity:.85;font-size:14px}' +
      '@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}' +
      '@media (prefers-reduced-motion:reduce){.ring::before,.ring img{animation:none}}' +
      '</style></head><body><div><div class="ring"><img src="https://cdn.ahlab.org/media/site/ahllogo_white.png" alt=""></div>' +
      '<h1>Creating 8 new passes…</h1><p>The print sheet opens here in a moment.</p></div></body></html>';

    // ── new passes set ───────────────────────────────────
    var sheetArmed = false;
    $('newSheetBtn').addEventListener('click', function () {
      var btn = $('newSheetBtn');
      if (!sheetArmed) {   // two-step confirm, no browser dialogs
        sheetArmed = true; btn.classList.add('confirming'); btn.innerHTML = '<i class="fa-solid fa-check"></i>Create 8 passes?';
        setTimeout(function () { if (sheetArmed) { sheetArmed = false; btn.classList.remove('confirming'); btn.innerHTML = '<i class="fa-solid fa-plus"></i>New passes set (set of 8)'; } }, 4000);
        return;
      }
      sheetArmed = false; btn.classList.remove('confirming'); btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch spin"></i>Creating…';
      // Open the tab inside the click (an async window.open is pop-up-blocked), then point it at the set.
      var tab = window.open('about:blank', '_blank');
      if (tab) { try { tab.document.write(LOADING_PAGE); tab.document.close(); } catch (e) {} }
      api('newSheet').then(function (res) {
        res.passes.forEach(function (p) { state.data.passes.push(p); });
        recount(); state.filter.batch = res.batch; renderAll();
        if (tab) { tab.location.href = printUrl(res.batch); toast('8 new passes created — print sheet opened in a new tab'); }
        else toast('8 new passes created — open its print sheet under Passes sets');
      }).catch(function (err) { if (tab) tab.close(); toast(err.message); })
        .then(function () { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-plus"></i>New passes set (set of 8)'; });
    });

    // ── drawer ──────────────────────────────────────────
    function find(code) { return state.data && state.data.passes.find(function (p) { return p.code === code; }); }
    function openDrawer(code) {
      var p = find(code); if (!p) return;
      state.open = code;
      $('dCode').textContent = p.code;
      $('dCopy').innerHTML = copyBtn(p.code);
      $('dChip').className = 'chip st-' + p.state; $('dChip').textContent = LABEL[p.state];
      var t = [];
      t.push(['', 'Created', fmt(p.createdAt, true) + (p.batch ? ' · batch ' + esc(p.batch) : '')]);
      if (p.activatedAt) t.push(['k-active', 'Activated by ' + esc(p.activatedBy) + (p.givenTo ? ' for <strong>' + esc(p.givenTo) + '</strong>' : ''),
        fmt(p.activatedAt, true) + (p.state === 'ACTIVE' ? ' · lapses ' + rel(p.activeUntil) : p.lapsed ? ' · lapsed unclaimed' : '')]);
      if (p.usedAt && p.state === 'USED') t.push(['k-used', 'Claimed by <strong>' + esc(p.visitorName) + '</strong>',
        fmt(p.usedAt, true) + '<br>' + esc(p.visitorEmail) + ' → <strong>' + esc(p.accountEmail) + '</strong>']);
      if (p.revokedAt) t.push(['k-revoked', 'Revoked by ' + esc(p.revokedBy), fmt(p.revokedAt, true)]);
      t.push([p.state === 'EXPIRED' ? 'k-expired' : '', p.state === 'EXPIRED' ? 'Expired' : 'Expires', fmt(p.expiresAt)]);

      var h = '<h3>History</h3><ul class="timeline">' + t.map(function (x) {
        return '<li class="' + x[0] + '">' + x[1] + '<div class="when">' + x[2] + '</div></li>';
      }).join('') + '</ul>';

      var acts = [];
      if (p.state === 'INACTIVE' || p.state === 'REVOKED') acts.push('<button class="btn btn-primary btn-sm" data-act="activate" type="button"><i class="fa-solid fa-bolt"></i>Activate</button>');
      if (p.state === 'ACTIVE')   acts.push('<button class="btn btn-secondary btn-sm" data-act="deactivate" type="button"><i class="fa-solid fa-power-off"></i>Deactivate</button>');
      if (p.state === 'INACTIVE' || p.state === 'ACTIVE' || p.state === 'EXPIRED')
        acts.push('<button class="btn btn-secondary btn-sm" data-act="extend" type="button" title="Set expiry to one year from today"><i class="fa-solid fa-calendar-plus"></i>Extend 1 year</button>');
      if (p.state !== 'USED' && p.state !== 'REVOKED')
        acts.push('<button class="btn btn-danger btn-sm" data-act="revoke" type="button"><i class="fa-solid fa-ban"></i>Revoke</button>');
      if (p.batch && p.state !== 'USED' && p.state !== 'REVOKED' && p.state !== 'EXPIRED')
        acts.push('<button class="btn btn-secondary btn-sm" data-act="print" type="button"><i class="fa-solid fa-print"></i>Print its batch</button>');
      if (acts.length) h += '<h3>Actions</h3><div class="actions">' + acts.join('') + '</div>';
      if (p.state === 'USED') h += '<p class="hint">To remove this guest account, delete ' + esc(p.accountEmail) + ' in the Google Admin console.</p>';
      $('dBody').innerHTML = h;
      $('drawer').classList.add('open'); $('scrim').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false');
    }
    function closeDrawer() {
      state.open = null; $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true');
    }
    $('dClose').addEventListener('click', closeDrawer);
    $('scrim').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

    var revokeArmed = false;
    $('dBody').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var p = find(state.open), act = b.dataset.act;
      if (act === 'print') { openPrint(p.batch); return; }
      if (act === 'revoke' && !revokeArmed) {
        revokeArmed = true; b.classList.add('confirm'); b.innerHTML = '<i class="fa-solid fa-ban"></i>Confirm revoke';
        setTimeout(function () { revokeArmed = false; if (b.isConnected) { b.classList.remove('confirm'); b.innerHTML = '<i class="fa-solid fa-ban"></i>Revoke'; } }, 4000);
        return;
      }
      revokeArmed = false;
      b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch spin"></i>';
      api(act, { code: p.code }).then(function (res) {
        upsert(res.pass);
        toast({ activate: 'Activated — works until ' + fmt(res.pass.activeUntil, true), deactivate: 'Deactivated',
                extend: 'Extended to ' + fmt(res.pass.expiresAt), revoke: 'Revoked' }[act]);
      }).catch(function (err) { toast(err.message); openDrawer(p.code); });
    });

    // ── QR scanner (mobile) ─────────────────────────────
    var stream = null, scanning = false, detector = null, jsqrLoading = null;
    function loadJsQR() {
      if (window.jsQR) return Promise.resolve();
      if (!jsqrLoading) jsqrLoading = new Promise(function (res, rej) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
      return jsqrLoading;
    }
    function startScan() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('This browser can\'t open the camera — type the code instead.'); return; }
      $('scanner').classList.remove('hidden'); $('scanStatus').textContent = 'Starting camera…';
      var ready = ('BarcodeDetector' in window)
        ? BarcodeDetector.getSupportedFormats().then(function (f) { if (f.indexOf('qr_code') !== -1) detector = new BarcodeDetector({ formats: ['qr_code'] }); else return loadJsQR(); })
        : loadJsQR();
      Promise.all([ready, navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })])
        .then(function (r) {
          stream = r[1]; var v = $('scanVideo'); v.srcObject = stream; return v.play();
        }).then(function () {
          $('scanStatus').textContent = 'Point at the QR on the card\'s back'; scanning = true; tick();
        }).catch(function (err) {
          stopScan(); toast(err && err.name === 'NotAllowedError' ? 'Camera permission was denied.' : 'Couldn\'t start the camera.');
        });
    }
    var canvas = document.createElement('canvas'), ctx2d = canvas.getContext('2d', { willReadFrequently: true });
    function tick() {
      if (!scanning) return;
      var v = $('scanVideo');
      if (v.readyState >= 2) {
        if (detector) {
          detector.detect(v).then(function (codes) { if (codes.length) found(codes[0].rawValue); else requestAnimationFrame(tick); })
            .catch(function () { requestAnimationFrame(tick); });
          return;
        }
        var w = v.videoWidth, h = v.videoHeight, s = Math.min(1, 720 / Math.max(w, h));
        canvas.width = w * s; canvas.height = h * s; ctx2d.drawImage(v, 0, 0, canvas.width, canvas.height);
        var img = ctx2d.getImageData(0, 0, canvas.width, canvas.height);
        var q = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (q && q.data) { found(q.data); return; }
      }
      requestAnimationFrame(tick);
    }
    function found(text) {
      var code = normCode(text);
      if (!code) { $('scanStatus').textContent = 'That QR isn\'t a Visitor Pass — try again'; requestAnimationFrame(tick); return; }
      if (navigator.vibrate) navigator.vibrate(60);
      stopScan(); focusCode(code);
    }
    function stopScan() {
      scanning = false;
      if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null; $('scanner').classList.add('hidden');
    }
    $('scanBtn').addEventListener('click', startScan);
    $('scanClose').addEventListener('click', stopScan);

    // ── boot ────────────────────────────────────────────
    $('signInBtn').addEventListener('click', signIn);
    $('signOutBtn').addEventListener('click', function () { setWho(false); signOut(); });
    function setWho(open) { $('who').classList.toggle('open', open); $('whoBtn').setAttribute('aria-expanded', String(open)); }
    $('whoBtn').addEventListener('click', function (e) { e.stopPropagation(); setWho(!$('who').classList.contains('open')); });
    document.addEventListener('click', function (e) { if (!e.target.closest('#who')) setWho(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setWho(false); });
    $('blockedSignOut').addEventListener('click', function () { signOut(); signIn(); });

    state.session = getSession();
    if (!state.session) { show('gate'); return; }
    var displayName = (state.session.name && state.session.name !== state.session.email) ? state.session.name
                      : state.session.email.split('@')[0];
    $('whoName').textContent = displayName;
    $('whoMenuName').textContent = displayName;
    $('whoEmail').textContent = state.session.email;
    if (state.session.picture) {
      var img = document.createElement('img');
      img.className = 'avatar'; img.alt = ''; img.referrerPolicy = 'no-referrer'; img.src = state.session.picture;
      img.onerror = function () { img.replaceWith(initialsEl()); };
      $('whoAvatar').replaceWith(img); img.id = 'whoAvatar';
    } else {
      $('whoAvatar').textContent = initials(displayName);
    }
    function initials(n) {
      return String(n).split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
    }
    function initialsEl() { var sp = document.createElement('span'); sp.className = 'avatar'; sp.textContent = initials(displayName); return sp; }
    show('loading');
    load().then(function () {
      show('app');
      var q = new URLSearchParams(location.search).get('code');   // deep link: /?code=AHLV-…
      if (q && normCode(q)) focusCode(normCode(q));
    }).catch(function (err) {
      if ($('gate').classList.contains('hidden') && $('blocked').classList.contains('hidden')) blocked('Something went wrong', err.message);
    });
  })();
  </script>
</body>
</html>
